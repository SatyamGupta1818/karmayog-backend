name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

# Global environment variables
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true" # Opt-in to Node 24 to silence Node 20 deprecation warnings

jobs:
  ci:
    name: Lint → Test → Build → Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test -- --coverage --passWithNoTests

      - name: Build
        run: npm run build

      # Step to programmatically lowercase the username for the Docker tag
      - name: Lowercase GHCR username
        if: github.ref == 'refs/heads/main'
        run: |
          echo "GHCR_USERNAME_LC=$(echo "${{ secrets.GHCR_USERNAME }}" | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secrets.GHCR_USERNAME }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        if: github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          # References the lowercase environment variable created in the step above
          tags: ghcr.io/${{ env.GHCR_USERNAME_LC }}/karmayog-backend:latest