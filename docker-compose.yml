services:

  app:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: karmayog_backend

    restart: unless-stopped

    ports:
      - "3000:3000"

    env_file:
      - .env

    depends_on:
      - postgres
      - redis

    networks:
      - app_network

  postgres:
    image: postgres:16-alpine

    container_name: postgres_db

    restart: unless-stopped

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: task_tracker

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - app_network

  redis:
    image: redis:7-alpine

    container_name: redis_cache

    restart: unless-stopped

    ports:
      - "6379:6379"

    volumes:
      - redis_data:/data

    networks:
      - app_network

volumes:
  postgres_data:
  redis_data:

networks:
  app_network: